<form id="contactForm">
  <input type="text" id="name" placeholder="Your Full Name" required>

  <input type="email" id="email" placeholder="Your Email" required>

  <input type="tel" id="phone" placeholder="Your Phone / WhatsApp Number" required>

  <input type="text" id="vehicle" placeholder="Vehicle Make & Model (e.g. Toyota Camry 2012)" required>

  <textarea id="message" rows="5" placeholder="Describe the problem or service you need..." required></textarea>

  <button type="submit">Send Message via WhatsApp 💬</button>

  <p id="formStatus" style="display:none; margin-top:15px; color:#166534; font-weight:600;">
    Form submitted successfully, we will get back to you shortly.
  </p>

  <p style="margin-top:10px;">
    Prefer email?
    <a href="mailto:dreamlandmotorworks@gmail.com">
      dreamlandmotorworks@gmail.com
    </a>
  </p>
</form>

<script>
document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const vehicle = document.getElementById("vehicle").value.trim();
    const message = document.getElementById("message").value.trim();

    const whatsappMessage =
        "NEW CUSTOMER ENQUIRY\n\n" +
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Phone / WhatsApp: " + phone + "\n" +
        "Vehicle: " + vehicle + "\n\n" +
        "Message:\n" + message;

    const whatsappURL =
        "https://wa.me/2349066616152?text=" +
        encodeURIComponent(whatsappMessage);

    // Open WhatsApp with the customer's completed enquiry
    window.open(whatsappURL, "_blank");

    // Show confirmation
    document.getElementById("formStatus").style.display = "block";

    // Clear the form
    this.reset();
});
</script>
