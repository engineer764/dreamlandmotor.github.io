<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — Dreamland Verified Admin</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 { margin-top: 0; font-size: 1.25rem; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 8px; }
        button:active { background: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 0.875rem; text-align: center; margin-top: 12px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Dreamland Admin Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="admin@dreamland.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
    </form>
</div>

<script type="module">
    import { loginStaff } from './supabaseClient.js'

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        const errorDiv = document.getElementById('errorMsg')

        errorDiv.style.display = 'none'

        try {
            await loginStaff(email, password)
            window.location.href = 'add-vehicle.html' // Redirect to mobile admin workflow
        } catch (err) {
            errorDiv.textContent = err.message
            errorDiv.style.display = 'block'
        }
    })
</script>

</body>
</html>
