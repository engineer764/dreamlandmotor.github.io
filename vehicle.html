<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details — Dreamland Verified</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --whatsapp: #25D366;
            --verified-green: #16a34a;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        .header-section { border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
        .badge { display: inline-block; background: #dcfce7; color: var(--verified-green); font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; }
        h1 { margin: 0 0 4px 0; font-size: 1.5rem; }
        .vehicle-id { color: #64748b; font-size: 0.875rem; }
        .price { font-size: 1.75rem; font-weight: 800; color: var(--accent); margin-top: 8px; }

        .specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .spec-item { font-size: 0.875rem; }
        .spec-label { color: #64748b; display: block; font-size: 0.75rem; }
        .spec-value { font-weight: bold; }

        .section-title { font-size: 1.125rem; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 24px; margin-bottom: 12px; }
        
        .finding-card { border: 1px solid var(--border); border-left: 4px solid #ca8a04; background: #fefce8; padding: 16px; border-radius: 6px; margin-bottom: 12px; }
        .finding-card.fail { border-left-color: #dc2626; background: #fef2f2; }
        
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--whatsapp); color: white; text-decoration: none; padding: 16px; font-size: 1rem; font-weight: bold; border-radius: 8px; margin-top: 24px; }
        .disclaimer { background: #f1f5f9; border: 1px solid var(--border); padding: 12px; font-size: 0.75rem; color: #475569; border-radius: 6px; margin-top: 24px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container" id="vehicleContainer">
    <p style="text-align:center;">Loading vehicle report...</p>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://xvzocwcchjdiyudrqorq.supabase.co'
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const urlParams = new URLSearchParams(window.location.search)
    const vehicleIdParam = urlParams.get('id') // e.g. DV-001

    async function loadVehicleDetails() {
        const container = document.getElementById('vehicleContainer')

        if (!vehicleIdParam) {
            container.innerHTML = '<p style="color:red;">No vehicle specified.</p>'
            return
        }

        // Query vehicle + inspection + findings where sales_status = PUBLISHED
        const { data: vehicles, error } = await supabase
            .from('vehicles')
            .select(`
                *,
                inspections (
                    id, inspection_date, mileage, overall_status, report_path,
                    inspection_findings (*)
                )
            `)
            .eq('vehicle_id', vehicleIdParam)
            .eq('sales_status', 'PUBLISHED')
            .single()

        if (error || !vehicles) {
            container.innerHTML = '<p style="color:red;">Vehicle not found or no longer available in the public catalogue.</p>'
            return
        }

        const car = vehicles
        const inspection = car.inspections && car.inspections[0] ? car.inspections[0] : null
        const findings = inspection ? inspection.inspection_findings : []

        const formattedPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(car.price)
        const formattedMileage = new Intl.NumberFormat().format(car.mileage)

        // Construct WhatsApp Message
        const waMessage = encodeURIComponent(`Hello Dreamland,\n\nI am interested in a Dreamland Verified vehicle.\n\nVehicle ID: ${car.vehicle_id}\nVehicle: ${car.year} ${car.make} ${car.model} ${car.trim || ''}\nPrice: ${formattedPrice}\n\nPlease confirm availability and viewing arrangements.`)
        const waLink = `https://wa.me/2349066616152?text=${waMessage}`

        container.innerHTML = `
            <div class="header-section">
                <div class="badge">🟢 ${car.verification_status.replace(/_/g, ' ')}</div>
                <h1>${car.year} ${car.make} ${car.model} ${car.trim || ''}</h1>
                <div class="vehicle-id">Vehicle ID: ${car.vehicle_id}</div>
                <div class="price">${formattedPrice}</div>
            </div>

            <div class="specs-grid">
                <div class="spec-item"><span class="spec-label">Mileage</span><span class="spec-value">${formattedMileage} km</span></div>
                <div class="spec-item"><span class="spec-label">Engine</span><span class="spec-value">${car.engine}</span></div>
                <div class="spec-item"><span class="spec-label">Transmission</span><span class="spec-value">${car.transmission}</span></div>
                <div class="spec-item"><span class="spec-label">Fuel Type</span><span class="spec-value">${car.fuel_type}</span></div>
                <div class="spec-item"><span class="spec-label">Colour</span><span class="spec-value">${car.colour}</span></div>
                <div class="spec-item"><span class="spec-label">Location</span><span class="spec-value">${car.location}</span></div>
            </div>

            <div class="section-title">Inspection Summary & Disclosed Findings</div>
            ${findings.length === 0 ? '<p>No specific attention notes or defects recorded for this vehicle.</p>' : ''}
            
            ${findings.filter(f => f.rating !== 'PASS').map(f => `
                <div class="finding-card ${f.rating.toLowerCase()}">
                    <strong>${f.area} — [${f.rating}]</strong>
                    <p><strong>Finding:</strong> ${f.finding}</p>
                    <p><strong>Significance:</strong> ${f.significance}</p>
                    <p><strong>Recommended Action:</strong> ${f.recommended_action}</p>
                </div>
            `).join('')}

            <a href="${waLink}" target="_blank" class="whatsapp-btn">
                Enquire About This Vehicle on WhatsApp
            </a>

            <div class="disclaimer">
                <strong>Buyer Disclaimer:</strong> Dreamland Verified reflects the condition observed at the time of inspection. It does not mean the vehicle is new, fault-free, or guaranteed against future mechanical or electrical problems.
            </div>
        `
    }

    loadVehicleDetails()
</script>

</body>
</html>
