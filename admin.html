<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dreamland Verified Cars</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- App Wrapper -->
    <div id="app" class="min-h-screen flex flex-col">

        <!-- Top Navigation Bar -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-car-shield text-blue-500 text-2xl"></i>
                    <span class="font-bold text-lg tracking-wide">Dreamland Admin Portal</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="admin-user-email" class="text-sm text-slate-300 hidden sm:inline">Loading user...</span>
                    <button id="logout-btn" class="bg-slate-800 hover:bg-red-600 text-slate-200 hover:text-white px-3 py-1.5 rounded text-sm transition-colors duration-200 flex items-center space-x-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <!-- Dashboard Header & Action bar -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Inventory Lifecycle Management</h1>
                    <p class="text-sm text-slate-600 mt-1">Manage, verify, publish, and track vehicle inspection workflows.</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="open-create-modal-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>New Vehicle Draft</span>
                    </button>
                    <button id="refresh-inventory-btn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors flex items-center space-x-1.5">
                        <i class="fa-solid fa-rotate"></i>
                        <span class="hidden sm:inline">Refresh</span>
                    </button>
                </div>
            </div>

            <!-- Status Alerts Container -->
            <div id="alert-container" class="mb-6 hidden"></div>

            <!-- Inventory Table Section -->
            <div class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-slate-800">All Vehicles</span>
                        <span id="vehicle-count-badge" class="bg-slate-100 text-slate-600 text-xs px-2.5 py-0.5 rounded-full font-medium">0 items</span>
                    </div>
                    <div class="relative w-full sm:w-64">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-search text-xs"></i>
                        </span>
                        <input type="text" id="inventory-search-input" placeholder="Search make, model, code..." class="w-full pl-9 pr-4 py-1.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-left">
                        <thead class="bg-slate-50 text-slate-600 uppercase text-xs tracking-wider">
                            <tr>
                                <th class="px-6 py-3 font-semibold">Vehicle Info</th>
                                <th class="px-6 py-3 font-semibold">Price / Location</th>
                                <th class="px-6 py-3 font-semibold">Verification</th>
                                <th class="px-6 py-3 font-semibold">Publication</th>
                                <th class="px-6 py-3 font-semibold">Sales Status</th>
                                <th class="px-6 py-3 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="bg-white divide-y divide-slate-200 text-sm text-slate-700">
                            <!-- Populated dynamically -->
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                                    <p>Loading inventory...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Create / Edit Vehicle Modal -->
    <div id="vehicle-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden my-8">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 id="modal-title" class="font-bold text-lg text-slate-900">Register New Vehicle Draft</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="vehicle-form" class="p-6 overflow-y-auto space-y-4">
                <input type="hidden" id="edit-vehicle-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Make *</label>
                        <input type="text" id="form-make" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Toyota">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Model *</label>
                        <input type="text" id="form-model" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Camry">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Trim</label>
                        <input type="text" id="form-trim" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. XLE">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Year *</label>
                        <input type="number" id="form-year" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 2022">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Mileage (km)</label>
                        <input type="number" id="form-mileage" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 45000">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Price (NGN)</label>
                        <input type="number" id="form-price" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 15000000">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Body Type</label>
                        <input type="text" id="form-body-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. SUV, Sedan">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Fuel Type</label>
                        <input type="text" id="form-fuel-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Petrol">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Transmission</label>
                        <input type="text" id="form-transmission" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Automatic">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Exterior Colour</label>
                        <input type="text" id="form-colour" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Pearl White">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Location</label>
                        <input type="text" id="form-location" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Lagos, Nigeria">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">VIN / Reg Number</label>
                        <input type="text" id="form-vin" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 1HGCR2F...">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Description & Notes</label>
                    <textarea id="form-description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter vehicle highlights or inspection summaries..."></textarea>
                </div>

                <div class="pt-4 border-t border-slate-200 flex items-center justify-end space-x-3">
                    <button type="button" id="cancel-modal-btn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Cancel</button>
                    <button type="submit" id="save-vehicle-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors">Save Draft</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard Controller Script -->
    <script type="module">
        import { requireAuth, logoutStaff } from './supabaseClient.js';
        import { 
            getAdminVehicles, 
            createVehicle, 
            updateVehicle, 
            verifyVehicle, 
            rejectVehicle, 
            publishVehicle, 
            unpublishVehicle, 
            reserveVehicle, 
            markAvailable, 
            markSold, 
            archiveVehicle 
        } from './vehicleService.js?v=2';

        let allVehicles = [];
        let currentEditingId = null;

        // Initialize dashboard session
        async function initDashboard() {
            const auth = await requireAuth();
            if (!auth) return;

            document.getElementById('admin-user-email').textContent = auth.profile.email || auth.session.user.email;
            document.getElementById('logout-btn').addEventListener('click', logoutStaff);

            await loadInventory();

            // Event Listeners
            document.getElementById('refresh-inventory-btn').addEventListener('click', loadInventory);
            document.getElementById('inventory-search-input').addEventListener('input', filterAndRenderVehicles);
            
            document.getElementById('open-create-modal-btn').addEventListener('click', () => openModal());
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);
            document.getElementById('vehicle-form').addEventListener('submit', handleFormSubmit);
        }

        async function loadInventory() {
            try {
                const tbody = document.getElementById('inventory-table-body');
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><p>Loading inventory...</p></td></tr>`;
                
                allVehicles = await getAdminVehicles();
                renderVehicles(allVehicles);
            } catch (err) {
                showAlert(err.message, 'error');
                document.getElementById('inventory-table-body').innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-red-500">Failed to load inventory.</td></tr>`;
            }
        }

        function renderVehicles(vehicles) {
            const tbody = document.getElementById('inventory-table-body');
            document.getElementById('vehicle-count-badge').textContent = `${vehicles.length} items`;

            if (!vehicles.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">No vehicles found.</td></tr>`;
                return;
            }

            tbody.innerHTML = vehicles.map(v => {
                const verificationBadge = getVerificationBadge(v.verification_status);
                const publicationBadge = getPublicationBadge(v.publication_status);
                const salesBadge = getSalesBadge(v.sales_status);
                const formattedPrice = v.price ? `₦${Number(v.price).toLocaleString()}` : 'Price TBD';

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-semibold text-slate-900">${v.year || ''} ${v.make || ''} ${v.model || ''}</div>
                            <div class="text-xs text-slate-500 flex items-center space-x-2 mt-0.5">
                                <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">${v.vehicle_code || 'Draft'}</span>
                                <span>${v.trim || ''}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-slate-900">${formattedPrice}</div>
                            <div class="text-xs text-slate-500">${v.location || 'Not specified'}</div>
                        </td>
                        <td class="px-6 py-4">${verificationBadge}</td>
                        <td class="px-6 py-4">${publicationBadge}</td>
                        <td class="px-6 py-4">${salesBadge}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="window.editVehicle('${v.id}')" class="text-blue-600 hover:text-blue-800 p-1" title="Edit Draft"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="window.handleAction('verify', '${v.id}')" class="text-emerald-600 hover:text-emerald-800 p-1" title="Verify"><i class="fa-solid fa-circle-check"></i></button>
                            <button onclick="window.handleAction('publish', '${v.id}')" class="text-indigo-600 hover:text-indigo-800 p-1" title="Publish"><i class="fa-solid fa-globe"></i></button>
                            <button onclick="window.handleAction('unpublish', '${v.id}')" class="text-amber-600 hover:text-amber-800 p-1" title="Unpublish"><i class="fa-solid fa-eye-slash"></i></button>
                            <button onclick="window.handleAction('reserve', '${v.id}')" class="text-purple-600 hover:text-purple-800 p-1" title="Reserve"><i class="fa-solid fa-bookmark"></i></button>
                            <button onclick="window.handleAction('sold', '${v.id}')" class="text-slate-600 hover:text-slate-800 p-1" title="Mark Sold"><i class="fa-solid fa-tag"></i></button>
                            <button onclick="window.handleAction('reject', '${v.id}')" class="text-red-600 hover:text-red-800 p-1" title="Reject"><i class="fa-solid fa-ban"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterAndRenderVehicles(e) {
            const query = e.target.value.toLowerCase();
            const filtered = allVehicles.filter(v => 
                (v.make && v.make.toLowerCase().includes(query)) ||
                (v.model && v.model.toLowerCase().includes(query)) ||
                (v.vehicle_code && v.vehicle_code.toLowerCase().includes(query))
            );
            renderVehicles(filtered);
        }

        function getVerificationBadge(status) {
            switch(status) {
                case 'VERIFIED': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Verified</span>`;
                case 'REJECTED': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Rejected</span>`;
                default: return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">Pending</span>`;
            }
        }

        function getPublicationBadge(status) {
            switch(status) {
                case 'PUBLISHED': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Published</span>`;
                default: return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">Unpublished</span>`;
            }
        }

        function getSalesBadge(status) {
            switch(status) {
                case 'RESERVED': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">Reserved</span>`;
                case 'SOLD': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-800 text-white">Sold</span>`;
                case 'ARCHIVED': return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-600">Archived</span>`;
                default: return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-50 text-green-700">Available</span>`;
            }
        }

        function openModal(vehicle = null) {
            const modal = document.getElementById('vehicle-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('vehicle-form');
            form.reset();

            if (vehicle) {
                currentEditingId = vehicle.id;
                title.textContent = 'Edit Vehicle Draft';
                document.getElementById('edit-vehicle-id').value = vehicle.id;
                document.getElementById('form-make').value = vehicle.make || '';
                document.getElementById('form-model').value = vehicle.model || '';
                document.getElementById('form-trim').value = vehicle.trim || '';
                document.getElementById('form-year').value = vehicle.year || '';
                document.getElementById('form-mileage').value = vehicle.mileage || '';
                document.getElementById('form-price').value = vehicle.price || '';
                document.getElementById('form-body-type').value = vehicle.body_type || '';
                document.getElementById('form-fuel-type').value = vehicle.fuel_type || '';
                document.getElementById('form-transmission').value = vehicle.transmission || '';
                document.getElementById('form-colour').value = vehicle.colour || '';
                document.getElementById('form-location').value = vehicle.location || '';
                document.getElementById('form-vin').value = vehicle.vin || vehicle.registration_number || '';
                document.getElementById('form-description').value = vehicle.description || '';
            } else {
                currentEditingId = null;
                title.textContent = 'Register New Vehicle Draft';
                document.getElementById('edit-vehicle-id').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('vehicle-modal').classList.add('hidden');
            currentEditingId = null;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('save-vehicle-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            const payload = {
                make: document.getElementById('form-make').value.trim(),
                model: document.getElementById('form-model').value.trim(),
                trim: document.getElementById('form-trim').value.trim(),
                year: document.getElementById('form-year').value ? parseInt(document.getElementById('form-year').value) : null,
                mileage: document.getElementById('form-mileage').value ? parseInt(document.getElementById('form-mileage').value) : null,
                price: document.getElementById('form-price').value ? parseFloat(document.getElementById('form-price').value) : null,
                bodyType: document.getElementById('form-body-type').value.trim(),
                fuelType: document.getElementById('form-fuel-type').value.trim(),
                transmissionType: document.getElementById('form-transmission').value.trim(),
                exteriorColor: document.getElementById('form-colour').value.trim(),
                location: document.getElementById('form-location').value.trim(),
                vin: document.getElementById('form-vin').value.trim(),
                description: document.getElementById('form-description').value.trim()
            };

            try {
                if (currentEditingId) {
                    await updateVehicle(currentEditingId, payload);
                    showAlert('Vehicle updated successfully!', 'success');
                } else {
                    await createVehicle(payload);
                    showAlert('Vehicle draft created successfully!', 'success');
                }
                closeModal();
                await loadInventory();
            } catch (err) {
                showAlert(`Failed to save vehicle: ${err.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Draft';
            }
        }

        window.editVehicle = function(id) {
            const vehicle = allVehicles.find(v => v.id === id);
            if (vehicle) openModal(vehicle);
        };

        window.handleAction = async function(action, id) {
            try {
                if (action === 'verify') await verifyVehicle(id);
                if (action === 'publish') await publishVehicle(id);
                if (action === 'unpublish') await unpublishVehicle(id);
                if (action === 'reserve') await reserveVehicle(id);
                if (action === 'sold') await markSold(id);
                if (action === 'reject') {
                    const reason = prompt('Enter rejection reason:');
                    if (reason === null) return;
                    await rejectVehicle(id, reason);
                }
                showAlert(`Action "${action}" completed successfully.`, 'success');
                await loadInventory();
            } catch (err) {
                showAlert(`Action failed: ${err.message}`, 'error');
            }
        };

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const bgClass = type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200';
            const iconClass = type === 'error' ? 'fa-circle-exclamation text-red-500' : 'fa-circle-check text-emerald-500';
            
            container.className = `mb-6 p-4 rounded-xl border flex items-center space-x-3 ${bgClass}`;
            container.innerHTML = `<i class="fa-solid ${iconClass} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            container.classList.remove('hidden');

            setTimeout(() => {
                container.classList.add('hidden');
            }, 5000);
        }

        initDashboard();
    </script>
</body>
</html>
