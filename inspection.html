<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Inspection — Dreamland Admin</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --pass: #16a34a;
            --attention: #ca8a04;
            --fail: #dc2626;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .area-card {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .area-title { font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
        .rating-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .rating-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border); background: white;
            font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center;
        }
        .rating-btn.active.pass { background: var(--pass); color: white; border-color: var(--pass); }
        .rating-btn.active.attention { background: var(--attention); color: white; border-color: var(--attention); }
        .rating-btn.active.fail { background: var(--fail); color: white; border-color: var(--fail); }
        
        .conditional-fields { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
        textarea, input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        button.save-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Inspection Checklist: <span id="vehicleDisplayId">DV-001</span></h2>
    <form id="inspectionForm">
        
        <div id="areasContainer">
            <!-- Dynamically injected via script for the 6 standard areas -->
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>Upload Inspection Report (PDF)</label>
            <input type="file" id="reportFile" accept=".pdf,.jpg,.png" required>
        </div>

        <button type="submit" class="save-btn">Complete & Submit Inspection</button>
    </form>
</div>

<script type="module">
    import { createInspection, addInspectionFinding, uploadInspectionReport } from './inspectionService.js'

    const areas = [
        "01 Mechanical",
        "02 Computer Diagnostics",
        "03 Electrical & Electronic",
        "04 Body & Accident",
        "05 Chassis / Suspension / Braking",
        "06 Interior / Functional / Road Test"
    ];

    const container = document.getElementById('areasContainer');
    
    areas.forEach((area, index) => {
        const card = document.createElement('div');
        card.className = 'area-card';
        card.innerHTML = `
            <div class="area-title">${area}</div>
            <div class="rating-group" data-area="${area}">
                <button type="button" class="rating-btn pass" onclick="setRating('${area}', 'PASS')">PASS</button>
                <button type="button" class="rating-btn attention" onclick="setRating('${area}', 'ATTENTION')">ATTENTION</button>
                <button type="button" class="rating-btn fail" onclick="setRating('${area}', 'FAIL')">FAIL</button>
            </div>
            <div class="conditional-fields" id="fields-${index}">
                <div class="form-group">
                    <label>Finding / Defect Description *</label>
                    <textarea name="finding_${index}" placeholder="Describe specific fault..."></textarea>
                </div>
                <div class="form-group">
                    <label>Significance / Safety Implication *</label>
                    <textarea name="significance_${index}" placeholder="Why does this matter?"></textarea>
                </div>
                <div class="form-group">
                    <label>Recommended Corrective Action *</label>
                    <textarea name="action_${index}" placeholder="What needs to be done?"></textarea>
                </div>
                <div class="form-group">
                    <label>Evidence Photos (Multiple)</label>
                    <input type="file" name="photos_${index}" multiple accept="image/*">
                </div>
            </div>
        `;
        container.appendChild(card);
    });

    // Global ratings state tracker
    window.inspectionState = {};

    window.setRating = function(area, rating) {
        window.inspectionState[area] = rating;
        const group = document.querySelector(`[data-area="${area}"]`);
        group.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('active', 'pass', 'attention', 'fail'));
        
        const clickedBtn = group.querySelector(`.${rating.toLowerCase()}`);
        clickedBtn.classList.add('active', rating.toLowerCase());

        const index = areas.indexOf(area);
        const fields = document.getElementById(`fields-${index}`);
        if (rating === 'ATTENTION' || rating === 'FAIL') {
            fields.style.display = 'block';
        } else {
            fields.style.display = 'none';
        }
    }
</script>

</body>
</html>
